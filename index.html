        * {
          animation: none !important;
          transition: none !important;
        }
      }

      function mkNoise() {

          b2 = 0,
          b3 = 0,
          b4 = 0,
          b5 = 0,
          b6 = 0;

          const w = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179;
          b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.969 * b2 + w * 0.153852;
          b3 = 0.8665 * b3 + w * 0.3104856;
          b4 = 0.55 * b4 + w * 0.5329522;
          b5 = -0.7616 * b5 - w * 0.016898;
          d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.16;

 <div class="surf"><h3>Location</h3><p class="mut">${
   loc.ok
     ? "Using your location for prayer times."
     : "Used for accurate prayer times."
 }</p><button class="btn alt sm" data-a="loc">Update location</button></div>
 <div class="surf"><h3>Timetable and subjects</h3><button class="btn alt sm" data-a="go" data-v="study">Edit in Study</button></div>
 ${modesCard()}<div class="surf"><h3>Reminders</h3><p class="mut">Quiet hours (only prayer reminders come through)</p><div class="row"><select id="sqs" aria-label="Quiet from">${hrOpts(
          S.qs
        )}</select><span>to</span><select id="sqe" aria-label="Quiet until">${hrOpts(
          S.qe
        )}</select></div><p class="mut">Bedtime (wind-down reminder 30 minutes before)</p><select id="sbd" aria-label="Bedtime">${hrOpts(
          S.bed
        )}</select><p class="mut" style="margin:12px 0 0">At most 6 reminders a day, at least 45 minutes apart, and fewer of the kinds you ignore.</p></div>
 <div class="surf"><h3>Ramadan</h3><div class="row sp"><span class="mut">Count down to Ramadan, then turn on by itself</span><button class="btn ${
   S.ram ? "" : "alt"
 } sm" data-a="rm">${
          S.ram ? "On" : "Off"
        }</button></div><div class="row sp" style="margin-top:10px"><span class="mut">Try the full Ramadan mode</span><button class="btn ${
          S.rtest ? "" : "alt"
        } sm" data-a="rt">${S.rtest ? "On" : "Off"}</button></div></div>
 ${shortcutsCard()}${backupCard()}<div class="surf"><h3>Setup</h3><p class="mut">See the welcome questions again. Your answers stay filled in.</p><button class="btn alt sm" data-a="redo">Run setup again</button></div>`;
      }
      function render() {
        applyTheme();
        let h;
        if (!S.done) h = ob();
        else
          h =
            topbar() +
            { today: today_, faith, study, well: well, settings, rev: review }[
              tab
            ]() +
            `<nav class="tabs">${[
              ["today", "Today"],
              ["faith", "Faith"],
              ["study", "Study"],
              ["well", "Wellbeing"],
              ["rev", "Review"],
            ]
              .map(
                ([k, l]) =>
                  `<button class="${
                    tab === k ? "on" : ""
                  }" data-a="go" data-v="${k}">${l}</button>`
              )
              .join("")}</nav>`;
        const y = scrollY;
        $("#app").innerHTML = h;
        document.documentElement.lang = S.lang === "ar" ? "ar" : "en";
        document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
        if (S.lang === "ar") localize($("#app"));
        scrollTo(0, y);
      }
      function bstart() {
        if (br) {
          clearInterval(br.t);
          br = null;
          render();
          return;
        }
        const P = [
            [4, 4, 4, 4],
            [4, 7, 8, 0],
            [5, 0, 5, 0],
          ][S.bp || 0],
          L = ["Breathe in", "Hold", "Breathe out", "Hold"],
          end = Date.now() + (S.bm || 5) * 60000;
        let ph = 0,
          left = 0;
        br = {};
        const step = () => {
          while (!P[ph]) ph = (ph + 1) % 4;
          const o = $("#orb");
          if (!o) return;
          left = P[ph];
          o.textContent = T(L[ph]);
          o.style.transition =
            "transform " + (ph % 2 ? 0 : left) + "s ease-in-out";
          o.style.transform = ph < 2 ? "scale(1.55)" : "scale(1)";
        };
        render();
        step();
        br.t = setInterval(() => {
          const r = end - Date.now();
          if (r <= 0) {
            clearInterval(br.t);
            br = null;
            render();
            return;
          }
          left--;
          if (left <= 0) {
            ph = (ph + 1) % 4;
            step();
          }
          const t = $("#brt");
          if (t)
            t.textContent = T(
              Math.ceil(r / 60000) + " min left · " + Math.max(left, 0) + "s"
            );
        }, 1000);
      }
      function addTodo() {
        const i = $("#tdn");
        if (i && i.value.trim()) {
          S.todos.push({
            t: i.value.trim(),
            d: false,
            m: +$("#tdm").value || 60,
            day: +$("#tdd").value,
          });
          save();
          render();
        }
      }
      function addGoal() {
        const n = $("#gn").value.trim();
        if (n) S.goals.push({ n, lim: +$("#gl").value || 45, spent: 0 });
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        const a = b.dataset.a,
          v = b.dataset.v,
          i = +b.dataset.i;
        if ($("#qn")) {
          S.name = $("#qn").value.trim();
          S.age = $("#qa").value;
          S.usual = $("#q1").value;
          S.goal = Math.max(1, +$("#q2").value || 8);
        }
        const AM = {
          cup: "water",
          cupi: "water",
          bstart: "calm",
          mood: "mood",
          pst: "study",
          run: "study",
          td: "study",
          az: "dhikr",
        };
        if (AM[a]) {
          S.ign[AM[a]] = 0;
          delete S.pend[AM[a]];
        }
        if (a === "next") {
          if (S.step === 0) {
            S.name = $("#qn").value.trim();
            S.age = $("#qa").value;
            S.usual = $("#q1").value;
            S.goal = Math.max(1, +$("#q2").value || 8);
          }
          if (S.step === 3) {
            if ($("#gn") && $("#gn").value.trim()) addGoal();
            S.done = true;
            getLoc();
            try {
              Notification.requestPermission();
            } catch (x) {}
            save();
            return render();
          }
          S.step++;
        } else if (a === "back") S.step--;
        else if (a === "ot") S.onTime = v;
        else if (a === "gd") S.gender = v;
        else if (a === "nq") qi = (qi + 1) % Q.length;
        else if (a === "redo") {
          S.done = false;
          S.step = 0;
          tab = "today";
        } else if (a === "rt") S.rtest = !S.rtest;
        else if (a === "rm") S.ram = !S.ram;
        else if (a === "usegoal") {
          const x = recWater();
          if (x) S.goal = x.g;
        } else if (a === "kh") S.kahf = S.kahf === today() ? "" : today();
        else if (a === "tpa") {
          const x = $("#tpn");
          if (x && x.value.trim() && S.top3.length < 3)
            S.top3.push({ t: x.value.trim(), d: false });
        } else if (a === "tpd") {
          const t = S.top3[i];
          t.d = !t.d;
          S.tdn += t.d ? 1 : -1;
        } else if (a === "tpx") {
          const t = S.top3[i];
          if (t.d) S.tdn--;
          S.top3.splice(i, 1);
        } else if (a === "exa") {
          const n = $("#exn").value.trim(),
            d = $("#exd").value;
          if (n && d) S.exams.push({ n, date: d, h: +$("#exh").value || 8 });
        } else if (a === "exx") S.exams.splice(i, 1);
        else if (a === "snd") {
          sound(v);
          snd = v;
        } else if (a === "act") {
          act = v;
          as = 0;
        } else if (a === "anx") {
          as++;
          if (as >= ACT[act].s.length) act = null;
        } else if (a === "abk") as = Math.max(0, as - 1);
        else if (a === "gsv") {
          const x = $("#gri");
          if (x) S.gr = x.value.trim();
        } else if (a === "qs") qstart();
        else if (a === "lang") S.lang = v;
        else if (a === "rsch") {
          if (!rsConf) {
            rsConf = true;
            setTimeout(() => {
              rsConf = false;
              render();
            }, 4000);
          } else {
            S.busy = {};
            rsConf = false;
          }
        } else if (a === "md") S.mode = v;
        else if (a === "bk")
          bkc = bkc
            ? ""
            : btoa(unescape(encodeURIComponent(JSON.stringify(S))));
        else if (a === "rst") {
          try {
            const x = JSON.parse(
              decodeURIComponent(escape(atob(($("#rbk").value || "").trim())))
            );
            if (!x || typeof x !== "object" || !("done" in x)) throw 0;
            S = Object.assign(fresh(), x);
            rollDay();
            pm = { mode: "f", left: S.pomo.f * 60, run: false, n: 0 };
            bkc = "";
            bkm = "Backup restored.";
          } catch (e) {
            bkm = "That code didn’t work.";
          }
        } else if (a === "settings") {
          tab = "settings";
          pk = false;
        } else if (a === "nt") {
          S.notif = !S.notif;
          try {
            if (S.notif) Notification.requestPermission();
          } catch (x) {}
        } else if (a === "th") {
          S.theme = +v;
          pk = false;
        } else if (a === "themes") pk = !pk;
        else if (a === "loc") getLoc();
        else if (a === "cell") {
          const k = b.dataset.k;
          if (S.busy[k]) delete S.busy[k];
          else S.busy[k] = 1;
        } else if (a === "dayfill") {
          const ks = [8, 9, 10, 11, 12, 13, 14].map((h) => i + "_" + h),
            all = ks.every((k) => S.busy[k]);
          ks.forEach((k) => (all ? delete S.busy[k] : (S.busy[k] = 1)));
        } else if (a === "addg") addGoal();
        else if (a === "delg") {
          if (running === i) running = -1;
          S.goals.splice(i, 1);
        } else if (a === "go") {
          tab = v;
          pk = false;
        } else if (a === "ck") {
          S.streak = S.last === yest() ? S.streak + 1 : 1;
          S.last = today();
        } else if (a === "cup") {
          S.cups = Math.min(20, S.cups + 1);
          S.wm = waterMsg();
        } else if (a === "cupi") {
          S.cups = S.cups === i + 1 ? i : i + 1;
          S.wm = waterMsg();
        } else if (a === "pray") S.prayed[i] = !S.prayed[i];
        else if (a === "azs") S.azs = v;
        else if (a === "az") {
          const z = AZS[S.azs][1][i],
            k = S.azs + i;
          S.azkar[k] = ((S.azkar[k] || 0) + 1) % (z[1] + 1);
        } else if (a === "run") running = running === i ? -1 : i;
        else if (a === "pst") pm.run = !pm.run;
        else if (a === "prs") {
          pm = { mode: "f", left: S.pomo.f * 60, run: false, n: pm.n };
        } else if (a === "psk") pmNext(false);
        else if (a === "td") {
          const t = S.todos[i];
          t.d = !t.d;
          S.tdn += t.d ? 1 : -1;
        } else if (a === "tdx") S.todos.splice(i, 1);
        else if (a === "tda") return addTodo();
        else if (a === "bp") S.bp = +v;
        else if (a === "bm") S.bm = +v;
        else if (a === "bstart") return bstart();
        else if (a === "mood") {
          S.mood = +v;
          S.mm = pick(MOOD[+v]);
        }
        save();
        render();
      });
      document.addEventListener("change", (e) => {
        const id = e.target.id;
        if (id === "sqs" || id === "sqe" || id === "sbd") {
          S[{ sqs: "qs", sqe: "qe", sbd: "bed" }[id]] = +e.target.value;
          save();
          return;
        }
        if (id === "sn") {
          S.name = e.target.value.trim();
          save();
          return;
        }
        if (id === "su") {
          S.usual = e.target.value;
          save();
          return;
        }
        if (id === "sg") {
          S.goal = Math.max(1, Math.min(20, +e.target.value || 8));
          S.cups = Math.min(S.cups, S.goal);
          save();
          return;
        }
        if (id === "pf" || id === "pb") {
          const x = Math.max(1, Math.min(120, +e.target.value || 25));
          if (id === "pf") S.pomo.f = x;
          else S.pomo.b = x;
          pm.left = (pm.mode === "f" ? S.pomo.f : S.pomo.b) * 60;
          pm.run = false;
          save();
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.id === "tdn") addTodo();
        if (e.key === "Enter" && e.target.id === "tpn")
          $("[data-a=tpa]").click();
      });
      document.addEventListener("input", (e) => {
        const id = e.target.id;
        if (id !== "qa" && id !== "sa") return;
        const prev = recWater();
        S.age = e.target.value;
        const x = recWater(),
          el = $(id === "qa" ? "#rec" : "#srec");
        if (el) el.textContent = T(recText());
        if (id === "qa" && x) {
          const q = $("#q2");
          if (q && (q.value === "" || +q.value === (prev ? prev.g : S.goal)))
            q.value = x.g;
        }
        if (id === "sa") save();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && rollDay()) {
          save();
          render();
        }
      });
      {
        let g = Math.floor(Math.random() * 3);
        if (g === S.lg) g = (g + 1) % 3;
        S.lg = g;
        save();
      }
      applyTheme();
      setTimes();
      if (S.done) getLoc();
      render();
      runHash();
      addEventListener("hashchange", runHash);
    </script>
  </body>
</html>
